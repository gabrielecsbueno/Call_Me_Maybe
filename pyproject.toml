[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.0",
    "pydantic>=2.13.4"
]

[dependency-groups]
dev = [
    "flake8>=7",
    "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.setuptools]
packages = ["llm_sdk"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }